<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - Pemilihan Ketua OSIS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SMKN 1 Sidayu</h1>
    <p>Pemilihan Ketua OSIS</p>
  </header>
  <div class="card">
    <h2 style="text-align:center;">Login</h2>
    <form>
      <label>NIS / Username</label><br>
      <input type="text" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;"><br><br>
      <label>Password</label><br>
      <input type="password" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;"><br><br>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
